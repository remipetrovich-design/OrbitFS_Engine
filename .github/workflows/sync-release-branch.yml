name: Manual Promote Main to Update Release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PROMOTE to validate current main and move UPDATE_RELEASE to it
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: manual-promote-update-release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check active GitHub profile
        id: profile
        shell: bash
        env:
          EXPECTED_GITHUB_PROFILE: fallback
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 2 --retry-delay 2 https://dev.incendiarynetworks.cc/api/github-profile)"
          active="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.profile||""))' "$response")"
          echo "Active GitHub profile: $active"
          echo "Expected for this repository: $EXPECTED_GITHUB_PROFILE"
          if [ "$active" != "$EXPECTED_GITHUB_PROFILE" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Inactive GitHub profile. Remaining workflow steps are disabled."
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Require explicit promotion confirmation
        if: steps.profile.outputs.run == 'true'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "PROMOTE"

      - name: Resolve latest main commit
        if: steps.profile.outputs.run == 'true'
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test -n "$sha"
          echo "target_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Validating latest main: $sha"

      - name: Checkout latest main exactly
        if: steps.profile.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.target_sha }}
          fetch-depth: 0

      - name: Use Node 22
        if: steps.profile.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        if: steps.profile.outputs.run == 'true'
        run: npm ci

      - name: Validate customer database migration history
        if: steps.profile.outputs.run == 'true'
        run: npm run db:migrations:check

      - name: Typecheck
        if: steps.profile.outputs.run == 'true'
        run: npm run check

      - name: Validate update tooling syntax
        if: steps.profile.outputs.run == 'true'
        run: |
          node --check tools/database-migrations.mjs
          node --check tools/check-database-migrations.mjs
          node --check tools/build-engine-release.mjs
          node --check tools/build-update-bundle.mjs
          node --check tools/build-release-analysis.mjs
          node --check tools/select-compatible-base-release.mjs
          node tools/select-compatible-base-release.mjs --self-test
          grep -q "orbitfs-db-migrations-v1" tools/database-migrations.mjs
          grep -q "orbitfs-db-migrations-v1" tools/build-update-bundle.mjs

      - name: Production build
        if: steps.profile.outputs.run == 'true'
        run: npm run build

      - name: Verify release branch database inventory
        if: steps.profile.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin UPDATE_RELEASE --prune
          changed_migrations="$(git diff --name-status origin/UPDATE_RELEASE HEAD -- supabase/migrations)"
          if printf '%s\n' "$changed_migrations" | awk 'NF && $1 != "A" {bad=1; print "Immutable migration changed or deleted: " $0} END {exit !bad}'; then
            echo "::error::Existing Engine migrations may not be modified/deleted. Add forward migrations instead."
            exit 1
          fi
          node tools/check-database-migrations.mjs
          release_sha="$(git rev-parse origin/UPDATE_RELEASE)"
          target_sha="$(git rev-parse HEAD)"
          if git merge-base --is-ancestor "$release_sha" "$target_sha"; then
            echo "UPDATE_RELEASE can fast-forward to validated main."
          else
            echo "UPDATE_RELEASE history diverged; promotion will automatically preserve its history with a reconciliation commit whose tree is validated main."
          fi
          echo "Engine migration tree validated at $target_sha"
          git ls-tree -r HEAD supabase/migrations | sha256sum

      - name: Promote validated main to UPDATE_RELEASE
        if: steps.profile.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: UPDATE_RELEASE
          TARGET_SHA: ${{ steps.source.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$RELEASE_BRANCH" --jq '.object.sha' 2>/dev/null || true)"
          promoted_sha="$TARGET_SHA"

          if [ -z "$current" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$RELEASE_BRANCH" -f sha="$TARGET_SHA" >/dev/null
          elif [ "$current" = "$TARGET_SHA" ]; then
            echo "$RELEASE_BRANCH already matches validated main."
          else
            git fetch origin "$RELEASE_BRANCH" --prune
            fetched="$(git rev-parse "origin/$RELEASE_BRANCH")"
            test "$fetched" = "$current" || {
              echo "::error::$RELEASE_BRANCH moved during promotion. Run promotion again."
              exit 1
            }

            if git merge-base --is-ancestor "$current" "$TARGET_SHA"; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$RELEASE_BRANCH" -f sha="$TARGET_SHA" -F force=false >/dev/null
            else
              changed_migrations="$(git diff --name-status "$current" "$TARGET_SHA" -- supabase/migrations)"
              if printf '%s\n' "$changed_migrations" | awk 'NF && $1 != "A" {bad=1; print "Immutable migration changed or deleted: " $0} END {exit !bad}'; then
                echo "::error::Cannot automatically reconcile because release migration history is not a byte-identical subset of validated main."
                exit 1
              fi

              git config user.name "OrbitFS Release Promotion"
              git config user.email "actions@users.noreply.github.com"
              target_tree="$(git rev-parse "$TARGET_SHA^{tree}")"
              promoted_sha="$(printf 'Reconcile %s ancestry with validated main %s\n' "$RELEASE_BRANCH" "$TARGET_SHA" | git commit-tree "$target_tree" -p "$current" -p "$TARGET_SHA")"
              git push origin "$promoted_sha:refs/heads/$RELEASE_BRANCH"
              echo "Preserved divergent $RELEASE_BRANCH history without force-pushing; promoted tree is exactly validated main."
            fi
          fi

          actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$RELEASE_BRANCH" --jq '.object.sha')"
          test "$actual" = "$promoted_sha"
          git fetch origin "$RELEASE_BRANCH" --prune
          target_tree="$(git rev-parse "$TARGET_SHA^{tree}")"
          release_tree="$(git rev-parse "origin/$RELEASE_BRANCH^{tree}")"
          test "$target_tree" = "$release_tree" || {
            echo "::error::Promoted release branch tree differs from validated main."
            exit 1
          }
          main_db_tree="$(git rev-parse "$TARGET_SHA:supabase/migrations")"
          release_db_tree="$(git rev-parse "origin/$RELEASE_BRANCH:supabase/migrations")"
          test "$main_db_tree" = "$release_db_tree" || {
            echo "::error::Promoted release branch migrations differ from inspected main."
            exit 1
          }
          echo "$RELEASE_BRANCH promoted from validated main $TARGET_SHA at $actual with identical source and database trees."
