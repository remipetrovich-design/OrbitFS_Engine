name: Engine Validation (No Deployment)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Active/passive GitHub profile guard is enforced before validation; fallback is currently the active source.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check active GitHub profile
        id: profile
        shell: bash
        env:
          EXPECTED_GITHUB_PROFILE: fallback
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 2 --retry-delay 2 https://dev.incendiarynetworks.cc/api/github-profile)"
          active="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.profile||""))' "$response")"
          echo "Active GitHub profile: $active"
          echo "Expected for this repository: $EXPECTED_GITHUB_PROFILE"
          if [ "$active" != "$EXPECTED_GITHUB_PROFILE" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Inactive GitHub profile. Remaining workflow steps are disabled."
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: steps.profile.outputs.run == 'true'
      - uses: actions/setup-node@v7
        if: steps.profile.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.profile.outputs.run == 'true'
      - name: Validate immutable Engine DB migration tree
        if: steps.profile.outputs.run == 'true'
        run: npm run db:migrations:check
      - name: Typecheck
        if: steps.profile.outputs.run == 'true'
        run: npm run check
      - name: Build
        if: steps.profile.outputs.run == 'true'
        run: npm run build
      - name: Validate release tooling
        if: steps.profile.outputs.run == 'true'
        run: |
          node --check tools/database-migrations.mjs
          node --check tools/build-engine-release.mjs
          node --check tools/build-update-bundle.mjs
          node --check tools/build-database-package.mjs
          node tools/select-compatible-base-release.mjs --self-test
      - name: Build and verify full Engine baseline and customer DB bundle
        if: steps.profile.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-engine-release.mjs \
            --version 0.0.0-ci --components mcp,apex,studio \
            --commit "$GITHUB_SHA" --minimum-base-version 1.0.0 \
            --output /tmp/orbitfs-engine-ci.json.gz
          node tools/build-update-bundle.mjs \
            --version 0.0.0-ci --components mcp,apex,studio \
            --commit "$GITHUB_SHA" --minimum-base-version 1.0.0 \
            --engine-artifact /tmp/orbitfs-engine-ci.json.gz \
            --output /tmp/orbitfs-update-ci.json.gz
          node - <<'NODE'
          const fs=require('fs'),{gunzipSync}=require('node:zlib');
          const bundle=JSON.parse(gunzipSync(fs.readFileSync('/tmp/orbitfs-update-ci.json.gz')).toString('utf8'));
          if(bundle.updateScope!=='engine-components-only-v1')throw new Error('CI Update bundle lost Engine-only scope');
          if(bundle.executor!=='orbitfs-base-inner-deployer-v1')throw new Error('CI Update bundle lost Base inner-deployer executor');
          if(bundle.payloads?.panel||bundle.baseBaseline)throw new Error('CI Update bundle contains forbidden Base/Panel payload data');
          if((bundle.components||[]).some((component)=>!['mcp','apex','studio'].includes(String(component))))throw new Error('CI Update bundle contains a forbidden update target');
          NODE
          node tools/verify-engine-database-package.mjs \
            /tmp/orbitfs-update-ci.json.gz "$GITHUB_SHA"
      - name: Build standalone central database packages
        if: steps.profile.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for component in engine-shared mcp apex studio; do
            node tools/build-database-package.mjs \
              --component "$component" \
              --commit "$GITHUB_SHA" \
              --minimum-base-version 1.0.0 \
              --minimum-base-schema-version 2 \
              --output "/tmp/database-package-$component.json"
            test -s "/tmp/database-package-$component.json"
            test "$(jq -r '.sourceCommit' "/tmp/database-package-$component.json")" = "$GITHUB_SHA"
            test "$(jq -r '.minimumBaseSchemaVersion' "/tmp/database-package-$component.json")" = "2"
          done
