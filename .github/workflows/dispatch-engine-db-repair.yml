name: Dispatch Engine DB repair candidate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-engine-db-repair.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch repaired Engine 1.0.0 candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: 68440a8cd0f0b98a21ec9896fddc476e2a4fc50f
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg source "$SOURCE_SHA" '{
            ref:"UPDATE_RELEASE",
            inputs:{
              version:"1.0.0",
              source_sha:$source,
              channel:"stable",
              base_channel:"stable",
              apex:"true",
              mcp:"true",
              studio:"true",
              minimum_deployer_protocol:"1",
              minimum_base_version:"1.0.0",
              previous_source_commit:"",
              notes:"Database split repair: complete Shared/MCP/APEX/Studio package set, repaired MCP context ownership and uniqueness, and Base-owned inner-deployer execution contract."
            }
          }')"
          curl --fail-with-body --silent --show-error -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/publish-engine-release.yml/dispatches"             -d "$payload"
          echo "Dispatched Engine repair candidate from $SOURCE_SHA"

# dispatch retry

# retry-marker: database-repair
