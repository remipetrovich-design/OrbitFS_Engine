<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;--bg:#090b10;--panel:#11141d;--line:#2b303c;--text:#f4f6fb;--muted:#959cad;--accent:#7d3038;--accent2:#35171b}
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--text);width:100%;overflow-x:hidden}button,select{font:inherit;color:var(--text)}
.app{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--bg);overflow:hidden}.head{padding:10px;border-bottom:1px solid var(--line);display:grid;gap:7px}.title{font-size:17px;font-weight:850}.sub,.meta{color:var(--muted);font-size:11px;line-height:1.35}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}.mode{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 8px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.switch{display:flex;gap:5px}.switch .on{background:var(--accent2);border-color:var(--accent)}button,select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 9px;min-height:34px}button{cursor:pointer}.primary{background:var(--accent2);border-color:var(--accent);font-weight:750}
.body{padding:9px}.notice{padding:7px 8px;border:1px dashed var(--line);border-radius:8px;margin-bottom:8px;font-size:12px}.notice.error{border-style:solid;border-color:#6e2933;background:#251116;color:#ffc3cc}.hidden{display:none}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:8px}.stats{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:7px}.stat{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 7px}
.list{display:grid;gap:5px}.item{width:100%;text-align:left;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.item b{display:block;font-size:12px}.detail{border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:9px}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin-top:8px}.badge{display:inline-block;border:1px solid #3a4050;border-radius:999px;padding:3px 6px;font-size:10px;color:#d3d7e0;margin:4px 4px 0 0}.empty{text-align:center;color:var(--muted);font-size:12px;padding:12px 4px}
@media(max-width:620px){.head,.body{padding:8px}.row{grid-template-columns:1fr}.quick{grid-template-columns:1fr 1fr}.quick button:first-child{grid-column:1/-1}.mode{align-items:flex-start}.actions button,button,select{min-height:38px;font-size:13px}}
</style></head><body>
<div class="app"><div class="head"><div><div class="title">OrbitFS Studio</div><div class="sub">Quick control here · write and edit by replying in chat</div></div>
<div class="row"><select id="workspace"><option>Loading workspaces…</option></select><button id="refresh">Refresh</button></div>
<div class="mode"><div><b id="modeTitle">Normal writing</b><div class="meta" id="modeHelp">Journals, documents and notes.</div></div><div class="switch"><button id="normalMode" class="on">Normal</button><button id="ventMode">Vent</button></div></div></div>
<div class="body"><div id="notice" class="notice">Connecting Studio…</div><div id="main" class="hidden">
<div id="homeView"><div class="quick"><button class="primary" id="newJournal">New journal</button><button id="newDocument">New document</button><button id="newNote">Quick note</button></div><div class="stats"><span class="stat" id="entryStat">0 entries</span><span class="stat" id="draftStat">0 drafts</span><span class="stat">Chat-first editing</span></div><div id="list" class="list"></div></div>
<div id="detailView" class="hidden"></div></div></div></div><script>
let state={workspaceId:null,workspaces:[],records:[],selectedRecord:null,approvals:[],routingAnalysis:null,studioMode:'normal',ventConfig:null,ventSaveLocation:''},busy=false;
const $=id=>document.getElementById(id),arr=v=>Array.isArray(v)?v:[],esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function extractState(r){const m=r?._meta||r?.metadata||{};return m.studioUiState||r?.structuredContent?.uiState||r?.structuredContent?.studioUiState||null}
function setNotice(text,type=''){const n=$('notice');n.textContent=text||'';n.className='notice '+type;n.classList.toggle('hidden',!text);$('main').classList.toggle('hidden',!state.workspaceId)}
async function call(name,args={}){if(!window.openai?.callTool)throw new Error('ChatGPT Studio bridge is not ready');const r=await window.openai.callTool(name,args);if(r?.isError||r?.structuredContent?.ok===false)throw new Error(r?.structuredContent?.error?.message||r?.content?.[0]?.text||'Studio request failed');const next=extractState(r);if(next)apply(next);return r}
async function run(label,fn){if(busy)return;busy=true;setNotice(label);try{const r=await fn();setNotice('');return r}catch(e){setNotice(e?.message||String(e),'error');throw e}finally{busy=false}}
async function chat(prompt){if(window.openai?.sendFollowUpMessage)return window.openai.sendFollowUpMessage({prompt,scrollToBottom:true});throw new Error('Chat reply bridge unavailable')}
function apply(next){state={...state,...next};render()}function ventOn(){return state.studioMode==='vent'}function isVent(r){return r?.type==='vent'||r?.subtype==='vent'||r?.metadata_json?.studioMode==='vent'}
function wsName(){return state.workspaces.find(w=>String(w.id)===String(state.workspaceId))?.name||state.workspaceId||'workspace'}
function createPrompt(kind){const vent=ventOn();if(vent)return 'Start a new OrbitFS Studio Vent entry in workspace "'+wsName()+'" ('+state.workspaceId+'). Draft it with me entirely in chat. Preserve my raw wording, profanity, tone, order and first-person perspective; only reword or format when I ask. Follow the workspace Vent title/config rules. Do NOT save, finalise or submit to Library until I explicitly tell you to. When I approve saving, use Studio MCP tools and keep it owner-only.';
return 'Start a new OrbitFS Studio '+kind+' in workspace "'+wsName()+'" ('+state.workspaceId+'). Draft it with me entirely in chat. I want to reply normally so we can format, reword and revise it together. Do NOT save or finalise until I explicitly approve. When I approve saving, use Studio MCP tools.'}
function card(r){return '<button class="item" data-id="'+esc(r.id)+'"><b>'+esc(r.title||'Untitled')+'</b><span class="meta">'+(isVent(r)?'Vent · ':'')+esc(r.type||r.subtype||r.kind||'entry')+' · '+esc(r.status||'draft')+'</span></button>'}
function detailHtml(){const r=state.selectedRecord;if(!r)return '';const latest=arr(state.approvals)[0]||null;return '<div class="detail"><button id="back">← Recent entries</button><div style="margin-top:7px"><b>'+esc(r.title||'Untitled')+'</b><div><span class="badge">'+(isVent(r)?'Vent Mode':esc(r.type||r.subtype||r.kind||'entry'))+'</span><span class="badge">'+esc(r.status||'draft')+'</span><span class="badge">rev '+esc(r.current_revision||1)+'</span>'+(latest?'<span class="badge">Library: '+esc(String(latest.status||'').replaceAll('_',' '))+'</span>':'')+'</div></div><div class="actions"><button class="primary" id="continueChat">Continue in chat</button><button id="renameChat">Rename in chat</button>'+(r.status!=='final'?'<button id="finalize">Finalize</button>':'<button id="draft">Return to draft</button>')+'<button id="route">Library routing</button><button id="publish">'+(['denied','changes_requested'].includes(latest?.status)?'Resubmit Library':'Submit Library')+'</button>'+(r.status!=='archived'?'<button id="archive">Archive</button>':'')+'</div></div>'}
function render(){const ws=$('workspace'),w=arr(state.workspaces);ws.innerHTML=w.length?w.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name||x.id)+'</option>').join(''):'<option>No workspaces</option>';if(state.workspaceId)ws.value=String(state.workspaceId);const vent=ventOn();$('modeTitle').textContent=vent?'Vent Mode ON':'Normal writing';$('modeHelp').textContent=vent?'Raw/private vent drafting happens in chat.':'Journals, documents and notes are drafted in chat.';$('normalMode').classList.toggle('on',!vent);$('ventMode').classList.toggle('on',vent);$('newJournal').textContent=vent?'New vent':'New journal';$('newDocument').classList.toggle('hidden',vent);$('newNote').classList.toggle('hidden',vent);$('entryStat').textContent=arr(state.records).length+' entries';$('draftStat').textContent=arr(state.records).filter(r=>r.status==='draft').length+' drafts';$('list').innerHTML=arr(state.records).length?arr(state.records).slice(0,4).map(card).join(''):'<div class="empty">No Studio entries yet.</div>';wireList();if(state.selectedRecord){$('homeView').classList.add('hidden');$('detailView').classList.remove('hidden');$('detailView').innerHTML=detailHtml();wireDetail()}else{$('detailView').classList.add('hidden');$('homeView').classList.remove('hidden')}if(state.workspaceId)$('main').classList.remove('hidden')}
function wireList(){document.querySelectorAll('.item').forEach(x=>x.onclick=()=>openRecord(x.dataset.id).catch(()=>{}))}
async function openRecord(id){await run('Loading entry…',async()=>{const r=await call('studio_get_record',{workspaceId:state.workspaceId,recordId:id});state.selectedRecord=r?.structuredContent?.record||null;state.approvals=r?.structuredContent?.approvals||[];state.routingAnalysis=null;render()})}
function editPrompt(r){return 'Continue editing OrbitFS Studio entry "'+r.title+'" (recordId "'+r.id+'") in workspace "'+wsName()+'". Load the current entry first. '+((isVent(r)||ventOn())?'Vent Mode: preserve my raw wording, profanity, tone, sequence and first-person perspective unless I ask for rewording. ':'')+'Work with me entirely in chat and only save changes through Studio MCP when I explicitly approve them. Do not submit to Library unless I explicitly ask.'}
function wireDetail(){const r=state.selectedRecord;if(!r)return;$('back').onclick=()=>{state.selectedRecord=null;state.approvals=[];state.routingAnalysis=null;render()};$('continueChat').onclick=()=>run('Opening in chat…',()=>chat(editPrompt(r))).catch(()=>{});$('renameChat').onclick=()=>run('Opening rename in chat…',()=>chat('Rename OrbitFS Studio entry "'+r.title+'" (recordId "'+r.id+'") in workspace "'+wsName()+'". Ask me what I want the new title to be, then use studio_update_record so the title and underlying source filename are renamed together. Do not change the entry content unless I ask.')).catch(()=>{});
const action=(id,a)=>{const b=$(id);if(b)b.onclick=()=>run('Updating entry…',()=>call('studio_record_action',{workspaceId:state.workspaceId,recordId:r.id,action:a})).then(()=>{state.selectedRecord=null}).catch(()=>{})};action('finalize','finalize');action('draft','draft');action('archive','archive');$('route').onclick=()=>run('Analysing Library routing…',()=>call('studio_analyse_routing',{workspaceId:state.workspaceId,recordId:r.id})).catch(()=>{});$('publish').onclick=()=>run('Submitting to Library review…',()=>call('studio_submit_approval',{workspaceId:state.workspaceId,recordId:r.id,useRoutingSuggestions:!!state.routingAnalysis})).catch(()=>{})}
async function refresh(workspaceId){return run(workspaceId?'Loading workspace…':'Loading Studio…',()=>call('studio_ui_state',workspaceId?{workspaceId}:{}))}
async function setMode(mode){if(!state.workspaceId)return;await run(mode==='vent'?'Turning Vent Mode on…':'Turning Vent Mode off…',()=>call('studio_set_mode',{workspaceId:state.workspaceId,mode}));state.studioMode=mode;state.selectedRecord=null;render()}
$('newJournal').onclick=()=>run('Opening chat…',()=>chat(createPrompt('journal'))).catch(()=>{});$('newDocument').onclick=()=>run('Opening chat…',()=>chat(createPrompt('document'))).catch(()=>{});$('newNote').onclick=()=>run('Opening chat…',()=>chat(createPrompt('note'))).catch(()=>{});$('normalMode').onclick=()=>setMode('normal').catch(()=>{});$('ventMode').onclick=()=>setMode('vent').catch(()=>{});$('workspace').onchange=e=>{state.selectedRecord=null;refresh(e.target.value).catch(()=>{})};$('refresh').onclick=()=>refresh(state.workspaceId).catch(()=>{});
function toolResult(result){const s=extractState(result);if(s)apply(s);else if(result?.structuredContent?.record){state.selectedRecord=result.structuredContent.record;render()}}window.addEventListener('message',e=>{if(e.data?.method==='ui/notifications/tool-result')toolResult(e.data.params)});window.addEventListener('studio:toolresult',e=>toolResult(e.detail));
const initial=window.openai?.toolResponseMetadata?.studioUiState||window.openai?.toolOutput?.studioUiState||window.openai?.toolOutput?.uiState||window.openai?.toolResult?._meta?.studioUiState;async function boot(attempt=0){if(initial&&attempt===0)apply(initial);else if(attempt===0)render();if(window.openai?.callTool)return refresh(initial?.workspaceId||state.workspaceId||undefined).catch(()=>{});if(attempt<25){setNotice('Connecting Studio to ChatGPT…');return setTimeout(()=>boot(attempt+1),150)}setNotice('Studio bridge did not become available. Close and reopen Studio.','error')}setTimeout(()=>boot(),50);
</script></body></html>
